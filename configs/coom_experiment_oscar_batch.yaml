# COOM on Oscar CPU batch (normal QoS: up to ~64 CPUs / user — see `myaccount`).
# ViZDoom-bound: use many parallel envs + no GPU. Use with: run_coom_oscar_batch.sh
#
# For GPU nodes, use configs/coom_experiment.yaml + run_coom_oscar.sh instead.

experiment: coom_hace_batch
total_steps: 1_000_000
num_seeds: 1

env:
  scenario: RAISE_THE_ROOF

agents:
  - name: vanilla
    alpha: 1.0
    beta: 0.0
  - name: hace
    alpha: 1.0
    beta: 1.0
  - name: pure_homeo
    alpha: 0.0
    beta: 1.0

hace_config:
  alpha: 1.0
  beta: 1.0
  health_setpoint: 100.0
  stamina_setpoint: 100.0
  stamina_source: stamina

ppo_config:
  policy: CnnPolicy
  # Match Slurm --cpus-per-task (e.g. 64): many Subproc workers; lower if OOM.
  n_envs: 24
  vec_env_subproc: true
  n_steps: 256
  batch_size: 128
  n_epochs: 4
  learning_rate: 3.0e-4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

eval:
  eval_episodes: 10

logging:
  save_dir: experiments/coom/results
  tensorboard: true

pilot:
  total_steps: 100_000
  eval_episodes: 5
  num_seeds: 1
