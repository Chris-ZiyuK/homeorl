episodes_per_task: 600
eval_interval: 50
eval_episodes: 40
boundary_mode: carryover
carryover_min_energy: 3.0
save_checkpoints: false

agent:
  hidden_dim: 128
  lr: 0.0005
  gamma: 0.99
  batch_size: 64
  buffer_size: 20000
  target_update: 25
  eps_start: 1.0
  eps_end: 0.05
  eps_decay: 800

environment:
  internal_coef: 1.0
  task_reward_coef: 1.0

logging:
  save_dir: experiments/mg_12task_test
  plot_name: seed.png
  json_name: seed.json
