experiment: cw_hace_cw10
total_steps: 300000
num_seeds: 3

# Choose exactly one:
# env:
#   task_name: reach-v1

sequence:
  name: CW10
  tasks:
    - hammer-v1
    - push-wall-v1
    - faucet-close-v1
    - push-back-v1
    - stick-pull-v1
    - handle-press-side-v1
    - push-v1
    - shelf-place-v1
    - window-close-v1
    - peg-unplug-side-v1

steps_per_task: 100000

agents:
  - name: vanilla
    alpha: 1.0
    beta: 0.0
  - name: hace
    alpha: 1.0
    beta: 0.1
  - name: pure_homeo
    alpha: 0.0
    beta: 1.0

ppo_config:
  device: cuda
  algo: ppo        # ppo|sac
  policy: MlpPolicy
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  ent_coef: 0.0
  gamma: 0.99
  gae_lambda: 0.95
  # sac-only
  buffer_size: 1000000

eval:
  eval_episodes: 5
  deterministic: true

logging:
  save_dir: experiments/cw/results
  tensorboard: true

pilot:
  total_steps: 30000
  eval_episodes: 2
  eval_deterministic: true
