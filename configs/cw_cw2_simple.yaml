#CONFIG=configs/cw2_window_push_sac.yaml sbatch --array=0-0 experiments/cw/run_cw_oscar.sh
experiment: cw2_reach_window_sac_hace
num_seeds: 4

sequence:
  name: cw2_reach_window_sac_hace
  tasks:
    - reach-v1
    - window-close-v1

steps_per_task: 500000

agents:
  - name: vanilla
    alpha: 1.0
    beta: 0.0
  - name: hace_001
    alpha: 1.0
    beta: 0.001

ppo_config:
  device: cuda
  algo: sac
  policy: MlpPolicy
  learning_rate: 3.0e-4
  batch_size: 256
  buffer_size: 300000
  learning_starts: 5000
  train_freq: 4
  gradient_steps: 1
  gamma: 0.99
  verbose: 0
  progress_bar: false

eval:
  eval_episodes: 50
  deterministic: false

logging:
  save_dir: experiments/cw/results
  tensorboard: true
  progress_prints: true
  progress_interval: 50000

pilot:
  total_steps: 30000
  eval_episodes: 5
  eval_deterministic: false