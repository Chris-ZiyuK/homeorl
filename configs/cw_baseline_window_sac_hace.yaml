experiment: cw_window_sac_hace
total_steps: 300000
num_seeds: 1

env:
  task_name: window-close-v1

agents:
  - name: vanilla
    alpha: 1.0
    beta: 0.0
  - name: hace_001
    alpha: 1.0
    beta: 0.001
  - name: hace_003
    alpha: 1.0
    beta: 0.003
  - name: hace_01
    alpha: 1.0
    beta: 0.01

ppo_config:
  device: cuda
  algo: sac
  policy: MlpPolicy
  learning_rate: 3.0e-4
  batch_size: 256
  buffer_size: 1000000
  gamma: 0.99
  verbose: 0
  progress_bar: false

eval:
  eval_episodes: 50
  deterministic: false

logging:
  save_dir: experiments/cw/results
  tensorboard: true
  progress_prints: true