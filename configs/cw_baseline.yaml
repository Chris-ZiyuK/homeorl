experiment: cw_baseline_reach_sac
total_steps: 300000
num_seeds: 1

env:
  task_name: reach-v1

agents:
  - name: vanilla
    alpha: 1.0
    beta: 0.0

ppo_config:
  device: cuda
  algo: sac
  policy: MlpPolicy
  learning_rate: 3.0e-4
  batch_size: 256
  buffer_size: 1000000
  gamma: 0.99
  verbose: 0
  progress_bar: false

eval:
  eval_episodes: 50
  deterministic: false

logging:
  save_dir: experiments/cw/results
  tensorboard: true
  progress_prints: true

pilot:
  total_steps: 30000
  eval_episodes: 5
  eval_deterministic: false